# The layers in src/ are bundled into game/ by tools/build.mjs, and the bundles
# are committed so game/ can be served or packaged as it is. This runs on every
# pull request and every push to main so that a broken layer, or a bundle that
# no longer matches its source, is caught here and not in the shop.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Kept out of package.json: npm install for the desktop app should not
      # pull down a browser. Pinned so a tool release cannot turn the build red
      # on its own.
      - name: Tools
        run: |
          npm install --no-save --no-audit --no-fund eslint@10.1.0 playwright@1.56.1 esbuild@0.28.2
          npx playwright install --with-deps chromium

      - name: Syntax
        run: npm run check:syntax

      - name: Water stability and coupling
        run: npm run check:water

      - name: People retain native positions
        run: npm run check:folk

      - name: Build is current
        run: npm run check:build

      - name: Wiring
        run: npm run check:wiring

      - name: Lint
        run: npm run check:lint

      - name: Boot
        run: npm run check:boot -- --shot boot.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-screenshot
          path: boot.png
          if-no-files-found: ignore
